# The label this applies is a routing decision: `feature` gets a written plan
# and your approval before any code (.claude/rules/github.md). Pick `task`
# instead when the approach is obvious and you would not want to read it
# first.
name: Feature
description: A new capability, or a change to how an existing one works. Planned and approved before it is built
labels: ['feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today. Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: How you will know this is done. Observable behaviour, not implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Optional. Anything deliberately in or out of bounds.
