services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # 5434, not 5432: a Postgres installed on the host takes the default
    # port, and the template this was built from already uses 5433. The
    # failure mode of colliding is that the app silently talks to the wrong
    # database, which is why each checkout gets a port of its own.
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
